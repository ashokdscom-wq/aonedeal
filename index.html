<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealSnap - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; height: 100vh; }
        .sidebar { width: 260px; background: #1e293b; border-right: 1px solid #334155; padding: 20px; }
        .sidebar h2 { font-size: 22px; margin-bottom: 30px; color: #fff; }
        .sidebar h2 span.deal { color: #3b82f6; }
        .sidebar h2 span.snap { color: #f97316; }
        .sidebar ul { list-style: none; }
        .sidebar ul li { padding: 12px 15px; margin-bottom: 8px; background: #334155; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .sidebar ul li:hover { background: #3b82f6; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header-title { font-size: 26px; margin-bottom: 30px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        .stat-card h3 { font-size: 16px; color: #94a3b8; margin-bottom: 10px; }
        .stat-card .number { font-size: 28px; font-weight: bold; color: #3b82f6; }
        .form-section { background: #1e293b; padding: 25px; border-radius: 8px; border: 1px solid #334155; max-width: 600px; }
        .form-section h3 { margin-bottom: 20px; font-size: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #cbd5e1; }
        .input-group input, .input-group textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; }
        .btn-save { background: #3b82f6; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-save:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2><span class="deal">Deal</span><span class="snap">Snap</span> Admin</h2>
        <ul>
            <li>📊 ડેશબોર્ડ</li>
            <li>📦 પ્રોડક્ટ મેનેજમેન્ટ</li>
            <li>🛒 ઓર્ડર લિસ્ટ</li>
            <li>⚙️ સેટિંગ્સ</li>
        </ul>
    </div>

    <div class="main-content">
        <h1 class="header-title">એડમિન ડેશબોર્ડ</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>કુલ ઓર્ડર</h3>
                <div class="number">૪૮</div>
            </div>
            <div class="stat-card">
                <h3>કુલ આવક</h3>
                <div class="number" style="color: #f97316;">₹૧,૨૪,૫૦૦</div>
            </div>
            <div class="stat-card">
                <h3>પ્રોડક્ટ્સ</h3>
                <div class="number" style="color: #10b981;">૧૨</div>
            </div>
        </div>

        <div class="form-section">
            <h3>નવી પ્રોડક્ટ ઉમેરો</h3>
            <div class="input-group">
                <label>પ્રોડક્ટનું નામ</label>
                <input type="text" placeholder="દા.ત. સ્માર્ટ વૉચ">
            </div>
            <div class="input-group">
                <label>કિંમત (₹)</label>
                <input type="number" placeholder="૧૯૯૯">
            </div>
            <div class="input-group">
                <label>પ્રોડક્ટ ફોટો લિંક (URL)</label>
                <input type="text" placeholder="Image URL દાખલ કરો">
            </div>
            <button class="btn-save">પ્રોડક્ટ સેવ કરો</button>
        </div>
    </div>

</body>
</html>
